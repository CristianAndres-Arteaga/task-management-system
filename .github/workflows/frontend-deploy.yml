name: Frontend CD

on:
  push:
    branches: [main]
    paths:
      - 'tms-frontend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tms-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://6xytmkc6x6.execute-api.us-east-2.amazonaws.com/prod
          VITE_COGNITO_USER_POOL_ID: us-east-2_rHEVgHGnb
          VITE_COGNITO_USER_POOL_CLIENT_ID: osp77i6i8irqmhf1p8df3dlp7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::552823820846:role/TmsGitHubActionsRole
          aws-region: us-east-2

      - name: Sync to S3
        run: aws s3 sync dist/ s3://tms-frontend-552823820846-552823820846-us-east-2-an/ --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E19TK9EV4A2PVP --paths "/*"