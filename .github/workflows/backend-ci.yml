name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/tms-backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [create-task, delete-task, list-tasks, post-confirmation, update-task]
    defaults:
      run:
        working-directory: backend/tms-backend/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend/tms-backend
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2

      - run: sam validate --lint
      - run: sam build