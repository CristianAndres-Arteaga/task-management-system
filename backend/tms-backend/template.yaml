AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  tms-backend

  Sample SAM Template for tms-backend

Parameters:
  AlertEmail:
    Type: String
    Description: Email address to receive backend alerts

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

    # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
    LoggingConfig:
      LogFormat: JSON
Resources:
  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: create-task/
      Description: "Se creara una nueva tarea para el usuario autenticado"
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref TmsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt TmsTable.Arn
      Events:
        CreateTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref TmsHttpApi
            Path: /tasks
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - app.ts
  ListTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: list-tasks/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref TmsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt TmsTable.Arn
      Events:
        ListTasks:
          Type: HttpApi
          Properties:
            ApiId: !Ref TmsHttpApi
            Path: /tasks
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - app.ts
  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: update-task/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref TmsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt TmsTable.Arn
      Events:
        UpdateTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref TmsHttpApi
            Path: /tasks/{taskId}
            Method: PATCH
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - app.ts
  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: delete-task/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref TmsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !GetAtt TmsTable.Arn
      Events:
        DeleteTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref TmsHttpApi
            Path: /tasks/{taskId}
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - app.ts
  TmsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:5173"
          - "https://d1n5bx4uzfv4qq.cloudfront.net"
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${TmsUserPool}"
              audience:
                - !Ref TmsUserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  TmsUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: tms-user-pool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
  TmsUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: tms-frontend
      UserPoolId: !Ref TmsUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  TmsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tms-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: post-confirmation/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref TmsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt TmsTable.Arn
      Events:
        PostConfirmation:
          Type: Cognito
          Properties:
            UserPool: !Ref TmsUserPool
            Trigger: PostConfirmation
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - app.ts

  CreateTaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CreateTaskFunction}"
      RetentionInDays: 14

  ListTasksLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ListTasksFunction}"
      RetentionInDays: 14

  UpdateTaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${UpdateTaskFunction}"
      RetentionInDays: 14

  DeleteTaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DeleteTaskFunction}"
      RetentionInDays: 14

  PostConfirmationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PostConfirmationFunction}"
      RetentionInDays: 14

  TmsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: tms-backend-alerts

  TmsAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref TmsAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  CreateTaskErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tms-create-task-errors
      AlarmDescription: "Errores en CreateTaskFunction"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CreateTaskFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TmsAlertsTopic

  ListTasksErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tms-list-tasks-errors
      AlarmDescription: "Errores en ListTasksFunction"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ListTasksFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TmsAlertsTopic

  UpdateTaskErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tms-update-task-errors
      AlarmDescription: "Errores en UpdateTaskFunction"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UpdateTaskFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TmsAlertsTopic

  DeleteTaskErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tms-delete-task-errors
      AlarmDescription: "Errores en DeleteTaskFunction"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DeleteTaskFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TmsAlertsTopic

  PostConfirmationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tms-post-confirmation-errors
      AlarmDescription: "Errores en PostConfirmationFunction"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PostConfirmationFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TmsAlertsTopic

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tms-api-5xx-errors
      AlarmDescription: "Errores 5xx en la HTTP API"
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref TmsHttpApi
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TmsAlertsTopic

  DynamoDbThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tms-dynamodb-throttles
      AlarmDescription: "Throttling en TmsTable"
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref TmsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TmsAlertsTopic

  TmsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: tms-backend-dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Errors",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${CreateTaskFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${ListTasksFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${UpdateTaskFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${DeleteTaskFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${PostConfirmationFunction}"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Duration (Average)",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${CreateTaskFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${ListTasksFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${UpdateTaskFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${DeleteTaskFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${PostConfirmationFunction}"]
                ],
                "period": 300,
                "stat": "Average",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway - Requests & Errors",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${TmsHttpApi}", "Stage", "prod"],
                  ["AWS/ApiGateway", "4xx", "ApiId", "${TmsHttpApi}", "Stage", "prod"],
                  ["AWS/ApiGateway", "5xx", "ApiId", "${TmsHttpApi}", "Stage", "prod"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB - Capacity & Throttles",
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${TmsTable}"],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${TmsTable}"],
                  ["AWS/DynamoDB", "ThrottledRequests", "TableName", "${TmsTable}"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            }
          ]
        }

Outputs:
  HttpApiId:
    Description: "ID de la HTTP API"
    Value: !Ref TmsHttpApi

  HttpApiEndpoint:
    Description: "URL base de la HTTP API"
    Value: !Sub "https://${TmsHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  UserPoolId:
    Description: "ID del Cognito User Pool"
    Value: !Ref TmsUserPool

  UserPoolClientId:
    Description: "ID del App Client de Cognito"
    Value: !Ref TmsUserPoolClient

  TableName:
    Description: "Nombre de la tabla DynamoDB"
    Value: !Ref TmsTable

  PostConfirmationFunctionArn:
    Description: "ARN de la Lambda PostConfirmation"
    Value: !GetAtt PostConfirmationFunction.Arn
