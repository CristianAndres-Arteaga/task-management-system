<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 980" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1800" height="980" fill="#F8FAFC"/>

  <!-- Header -->
  <rect x="0" y="0" width="1800" height="80" fill="#0F172A"/>
  <text x="40" y="34" font-size="21" font-weight="700" fill="#FFFFFF">Task Management System</text>
  <text x="40" y="58" font-size="13" fill="#94A3B8">Arquitectura AWS Serverless — Single-table DynamoDB · HTTP API + Cognito JWT · CI/CD con GitHub Actions (OIDC)</text>

  <!-- AWS Cloud boundary -->
  <rect x="210" y="100" width="1350" height="840" rx="14" fill="#EFF3F8" stroke="#B9C4D3" stroke-width="1.6" stroke-dasharray="7,5"/>
  <text x="234" y="126" font-size="13" font-weight="700" fill="#64748B" letter-spacing="0.5">AWS CLOUD — us-east-2</text>

  <!-- Usuario -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="480" width="150" height="100" rx="12" fill="#334155"/>
  </g>
  <circle cx="105" cy="513" r="12" fill="none" stroke="#E2E8F0" stroke-width="2.4"/>
  <path d="M87,552 a18,16 0 0 1 36,0" fill="none" stroke="#E2E8F0" stroke-width="2.4"/>
