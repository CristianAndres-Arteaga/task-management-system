  <line x1="1194" y1="192" x2="1470" y2="192" stroke="#E2E8F0" stroke-width="1"/>

  <circle cx="1204" cy="216" r="9" fill="#7C3AED"/><text x="1222" y="220" font-size="12" fill="#334155">Frontend hosting (CloudFront + S3)</text>
  <circle cx="1204" cy="244" r="9" fill="#DC2626"/><text x="1222" y="248" font-size="12" fill="#334155">Autenticación (Cognito)</text>
  <circle cx="1204" cy="272" r="9" fill="#DB2777"/><text x="1222" y="276" font-size="12" fill="#334155">API Gateway / SNS</text>
  <circle cx="1204" cy="300" r="9" fill="#EA580C"/><text x="1222" y="304" font-size="12" fill="#334155">Compute (Lambda)</text>
  <circle cx="1204" cy="328" r="9" fill="#2563EB"/><text x="1222" y="332" font-size="12" fill="#334155">Datos (DynamoDB)</text>
  <circle cx="1204" cy="356" r="9" fill="#0D9488"/><text x="1222" y="360" font-size="12" fill="#334155">Monitoreo (CloudWatch)</text>

  <line x1="1194" y1="374" x2="1470" y2="374" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="1194" y1="394" x2="1224" y2="394" stroke="#334155" stroke-width="2"/>
  <text x="1232" y="398" font-size="11.5" fill="#334155">Flujo síncrono (request/response)</text>
