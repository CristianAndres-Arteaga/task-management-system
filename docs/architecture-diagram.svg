  <text x="527" y="378" font-size="10" fill="#334155">trigger</text>

  <!-- PostConfirmation -> DynamoDB -->
  <path d="M810,375 C860,360 880,400 900,495" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="820" y="415" font-size="10" fill="#334155">PutItem (perfil)</text>

  <!-- Usuario -> API GW -->
  <path d="M180,555 C215,555 215,555 270,555" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="182" y="565" width="130" height="20" rx="10" fill="#F8FAFC"/>
  <text x="247" y="579" font-size="11" fill="#334155" text-anchor="middle">HTTPS + JWT (Access Token)</text>

