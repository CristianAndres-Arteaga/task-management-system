  <g filter="url(#softShadow)"><rect x="580" y="505" width="250" height="110" rx="10" fill="#FFFFFF"/></g>
  <rect x="580" y="505" width="250" height="5" rx="2.5" fill="#EA580C"/>
  <circle cx="610" cy="542" r="17" fill="#EA580C"/>
  <text x="610" y="548" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">λ</text>
  <text x="636" y="540" font-size="13.5" font-weight="700" fill="#1E293B">Lambdas CRUD</text>
