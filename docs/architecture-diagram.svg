  <text x="470" y="668" font-size="10" fill="#64748B">logs</text>

  <!-- CRUD Lambdas / API GW / DynamoDB -> CloudWatch Alarms -->
  <path d="M700,615 C690,650 680,665 675,695" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
  <path d="M420,615 C480,655 560,670 590,695" fill="none" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
  <path d="M990,625 C920,660 800,675 760,695" fill="none" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
  <text x="700" y="660" font-size="10" fill="#64748B">métricas</text>

