  <text x="264" y="322" font-size="12.5" font-weight="700" fill="#B91C1C" letter-spacing="0.4">AUTENTICACIÓN</text>

  <g filter="url(#softShadow)"><rect x="270" y="335" width="250" height="100" rx="10" fill="#FFFFFF"/></g>
  <rect x="270" y="335" width="250" height="5" rx="2.5" fill="#DC2626"/>
  <circle cx="300" cy="370" r="17" fill="#DC2626"/>
  <text x="300" y="375" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">CG</text>
  <text x="326" y="373" font-size="14" font-weight="700" fill="#1E293B">Cognito User Pool</text>
  <text x="300" y="404" font-size="11.5" fill="#64748B">SRP auth · sin MFA</text>
  <text x="300" y="420" font-size="11.5" fill="#64748B">PreventUserExistenceErrors</text>

