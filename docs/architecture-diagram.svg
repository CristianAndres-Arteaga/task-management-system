  <circle cx="590" cy="730" r="16" fill="#0D9488"/>
  <text x="590" y="735" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CW</text>
  <text x="615" y="728" font-size="12.5" font-weight="700" fill="#1E293B">CloudWatch Alarms</text>
  <text x="590" y="760" font-size="11" fill="#64748B">7 alarmas activas</text>
  <text x="590" y="775" font-size="11" fill="#64748B">Errors · 5xx · Throttles</text>

  <g filter="url(#softShadow)"><rect x="850" y="695" width="230" height="100" rx="10" fill="#FFFFFF"/></g>
