  <circle cx="880" cy="730" r="16" fill="#0D9488"/>
  <text x="880" y="735" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CW</text>
  <text x="905" y="728" font-size="12.5" font-weight="700" fill="#1E293B">Dashboard</text>
  <text x="880" y="760" font-size="11" fill="#64748B">4 widgets (métricas clave)</text>

  <g filter="url(#softShadow)"><rect x="560" y="815" width="230" height="90" rx="10" fill="#FFFFFF"/></g>
