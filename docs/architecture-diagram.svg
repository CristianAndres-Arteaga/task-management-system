  <g filter="url(#cardShadow)"><rect x="1620" y="815" width="150" height="90" rx="10" fill="#334155"/></g>
  <path d="M1640,838 h110 v44 h-110 z M1640,838 l55,32 l55,-32" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <text x="1695" y="898" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Email (fuera de AWS)</text>

  <!-- ===================================================================== -->
  <!-- ARROWS -->
  <!-- Usuario -> CloudFront -->
  <path d="M180,505 C230,505 230,215 270,215" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
