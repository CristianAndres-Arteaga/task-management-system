  <text x="105" y="605" font-size="0" />
  <text x="105" y="500" font-size="0"/>
  <text x="105" y="568" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Usuario</text>
  <text x="105" y="596" font-size="0"/>
  <text x="105" y="491" font-size="0"/>

  <!-- ===================================================================== -->
  <!-- LANE 1 — FRONTEND HOSTING -->
  <rect x="240" y="130" width="1300" height="155" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.4"/>
  <rect x="240" y="130" width="6" height="155" fill="#7C3AED"/>
  <text x="264" y="152" font-size="12.5" font-weight="700" fill="#6D28D9" letter-spacing="0.4">FRONTEND HOSTING</text>

  <g filter="url(#softShadow)"><rect x="270" y="165" width="230" height="100" rx="10" fill="#FFFFFF"/></g>
  <rect x="270" y="165" width="230" height="5" rx="2.5" fill="#7C3AED"/>
  <circle cx="300" cy="200" r="17" fill="#7C3AED"/>
  <text x="300" y="205" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CF</text>
  <text x="326" y="203" font-size="14" font-weight="700" fill="#1E293B">CloudFront</text>
  <text x="300" y="240" font-size="11.5" fill="#64748B">CDN global + terminación HTTPS</text>

  <g filter="url(#softShadow)"><rect x="560" y="165" width="250" height="100" rx="10" fill="#FFFFFF"/></g>
