  <rect x="580" y="335" width="230" height="5" rx="2.5" fill="#EA580C"/>
  <circle cx="610" cy="370" r="17" fill="#EA580C"/>
  <text x="610" y="376" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">λ</text>
