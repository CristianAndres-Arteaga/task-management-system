  <text x="207" y="257" font-size="11" fill="#334155" text-anchor="middle">HTTPS</text>

  <!-- CloudFront -> S3 -->
  <path d="M500,215 L560,215" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="503" y="196" width="66" height="18" rx="9" fill="#F5F3FF"/>
  <text x="536" y="209" font-size="10.5" fill="#334155" text-anchor="middle">OAC privado</text>

  <!-- Usuario -> Cognito -->
  <path d="M180,525 C225,525 225,385 270,385" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="182" y="415" width="88" height="20" rx="10" fill="#F8FAFC"/>
