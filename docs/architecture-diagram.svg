  <text x="610" y="588" font-size="11.5" fill="#64748B">1 función por operación</text>

  <g filter="url(#softShadow)"><rect x="890" y="495" width="260" height="130" rx="10" fill="#FFFFFF"/></g>
  <rect x="890" y="495" width="260" height="5" rx="2.5" fill="#2563EB"/>
  <circle cx="920" cy="533" r="17" fill="#2563EB"/>
  <text x="920" y="538" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">DB</text>
  <text x="946" y="531" font-size="13.5" font-weight="700" fill="#1E293B">DynamoDB</text>
